
# Application
spring.application.name=climentos-auth
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/auth_system
spring.datasource.username=auth_app
spring.datasource.password=${DB_PASSWORD}

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Thymeleaf
spring.thymeleaf.cache=false

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}

# SMTP Authentication and Encryption
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email Timeouts
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Password Reset URL and Sender
app.base-url=http://localhost:8080
app.mail-from=${MAIL_FROM}

# Session Security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
